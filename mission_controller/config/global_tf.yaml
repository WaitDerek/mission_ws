realbots_global_tf:
  ros__parameters:
    # The hardware feedback streams use Best Effort QoS.
    body_feedback_topic: /mcap/body
    left_arm_feedback_topic: /mcap/slave_arm_left
    right_arm_feedback_topic: /mcap/slave_arm_right
    # The node also accepts a complete JointState stream when one is present.
    joint_state_topic: /joint_states

    base_frame: base_footprint
    output_frame: base_footprint
    camera_optical_frame: left_arm_depth_cam_color_optical_frame

    # Gemini 305's optical origin is the left RGB module. In the URDF the
    # physical chain is Link8 -> left_camera_Link (the 90-degree connector /
    # camera assembly) -> left_binocular_left_camera_Link (left RGB origin).
    # Attach the Orbbec driver's root at that assembly and use the CAD offset
    # to put its color optical frame on the URDF left-eye origin.
    camera_mount_parent_link: left_camera_Link
    camera_mount_child_frame: left_arm_depth_cam_link
    # Restore the URDF left_rgb_camera_Link origin, then move 1.0 cm backward
    # along the corrected depth frame's local -Z and another 0.9 cm along -Y.
    camera_mount_xyz: [0.016325263935158, -0.000868828307099, -0.010043858627213]
    # The driver publishes the optical frame below left_arm_depth_cam_link.
    # Requested corrected axes (expressed in the currently published optical
    # frame): X_correct=-Z_current, Y_correct=-X_current, Z_correct=Y_current.
    # This is C=[[0,-1,0],[0,0,1],[-1,0,0]], q_xyzw=[-0.5,0.5,0.5,0.5].
    # C is conjugated through the driver's link->optical transform and folded
    # into this upstream mount, so the optical frame keeps one TF parent.
    # Prepend a local -5-degree roll so left_camera_Link remains at its
    # original 25-degree mechanical mount while downstream camera frames use
    # a 20-degree optical-frame alignment. Then remap the resulting local
    # axes as X_new=-Z_current, Y_new=Y_current, Z_new=X_current.
    camera_mount_quaternion_xyzw: [0.031607850, 0.030185435, 0.706565983, -0.706296181]

    # The right camera uses the same URDF assembly chain and left-RGB origin.
    # Relative to the currently observed optical frame, the requested
    # correction is x_new=-x_old, y_new=y_old, z_new=-z_old.  This is a
    # 180-degree rotation about the optical Y axis.  It is conjugated through
    # the depth-camera driver transform before being folded into this mount.
    right_camera_mount_parent_link: right_camera_Link
    right_camera_mount_child_frame: right_arm_depth_cam_link
    right_camera_mount_xyz: [0.049094570020, 0.0, -0.000100000000]
    right_camera_mount_quaternion_xyzw: [-0.497028867, -0.503278286, -0.498134947, 0.501532498]

    body_input_joint_names: [joint1, joint2, joint3, joint4]
    body_urdf_joint_names: [
      waist_1_joint,
      waist_2_joint,
      waist_3_joint,
      chest_joint
    ]
    neck_input_joint_names: [joint1, joint2]
    neck_urdf_joint_names: [neck_Link, head_joint]
    left_arm_input_joint_names: [
      joint1, joint2, joint3, joint4, joint5, joint6, joint7
    ]
    right_arm_input_joint_names: [
      joint1, joint2, joint3, joint4, joint5, joint6, joint7
    ]
    left_arm_urdf_joint_names: [
      left_arm_1_joint,
      left_arm_2_joint,
      left_arm_3_joint,
      left_arm_4_joint,
      left_arm_5_joint,
      left_arm_6_joint,
      left_arm_7_joint
    ]
    right_arm_urdf_joint_names: [
      right_arm_1_joint,
      right_arm_2_joint,
      right_arm_3_joint,
      right_arm_4_joint,
      right_arm_5_joint,
      right_arm_6_joint,
      right_arm_7_joint
    ]

    publish_rate_hz: 30.0
    max_feedback_age_sec: 0.5
    # robot_state_publisher needs a value for every movable URDF joint before
    # it publishes that branch. Measured waist/arm values override this zero;
    # unavailable steering/head groups remain visible at their neutral pose.
    publish_complete_joint_states: true
    default_joint_position: 0.0

    # Mission compatibility frames.  The active box geometry uses base_Link's
    # coordinates, while Adaptive and the SDK target conversion retain the
    # lowercase/legacy frame names.  The aliases are published by
    # realbots_global_tf; the two arm-base transforms are recomputed from the
    # measured waist/chest joints on every TF cycle.
    compatibility_frames_enabled: true
    compatibility_urdf_root_frame: base_Link
    compatibility_base_frame: base_link
    compatibility_chest_frame: chest_Link
    compatibility_left_arm_base_frame: L_base_Link
    compatibility_right_arm_base_frame: R_base_Link
    compatibility_left_chest_to_arm_base_xyz: [0.012, 0.0, -0.2975]
    compatibility_left_chest_to_arm_base_rpy: [0.0, 3.141592654, 0.0]
    compatibility_right_chest_to_arm_base_xyz: [-0.012, 0.0, -0.2975]
    compatibility_right_chest_to_arm_base_rpy: [3.141592654, 0.0, 0.0]
