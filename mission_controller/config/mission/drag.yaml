# Generated from mission.yaml; edit by responsibility, not by size.
mission_controller:
  ros__parameters:
    drag_box_tf_horizontal_constraint_enabled: true
    # Disable fixed contact span; use the original box-relative contact offsets.
    drag_box_tf_left_join_contact_span_m_bigbox: 0.0
    # Bigbox layers 1 and 2 search waist poses with bilateral clearance scoring.
    drag_box_tf_fixed_waist_enabled_bigbox_layer1: false
    drag_box_tf_fixed_waist_enabled_bigbox_layer2: false
    # Observation mirror: J2/J4 unchanged; J1/J3/J5/J6/J7 negated.
    drag_box_tf_detection_arm: right
    # All Drag models/layers: initial contact +4cm in footprint Z, before fixture compensation.
    drag_box_tf_contact_height_offset_m: 0.04
    # Layer 1 right contact: robot-backward (+footprint Y), both box types.
    drag_box_tf_right_backward_offset_m_layer1: 0.045
    # Layer 2 right contact: robot-backward (+footprint Y), both box types.
    drag_box_tf_right_backward_offset_m_layer2: 0.01
    # Target offsets only: right BEFORE dragging, left in its AFTER-Drag3 join pose.
    drag_box_tf_right_forward_offset_m_layer3: 0.01
    drag_box_tf_right_forward_offset_m_layer4: 0.01
    drag_box_tf_left_join_forward_offset_m_layer3: 0.03
    # Actual left joining target: robot forward (-base_footprint Y), both box types/layers 1-4.
    drag_box_tf_left_join_forward_offset_m: 0.02
    # Layer 1 overrides the common left-join trim; negative means inherit.
    drag_box_tf_left_join_forward_offset_m_layer1: 0.015
    # Layer 4 left target after Drag3: forward 3cm.
    drag_box_tf_left_join_forward_offset_m_layer4: 0.03
    # Robot forward is base_footprint -Y. Preserve lateral X, height, orientation.
    # Apply before fixture compensation; rebuild the delayed left contact from
    # its UNSCALED box relation after Drag3, so k is applied exactly once.
    drag_box_tf_left_contact_forward_delta_scale: 1.0
    drag_box_tf_right_contact_forward_delta_scale: 1.0
    drag_box_tf_detection_arm_smallbox: right
    # Fixed/dynamic workflow DragBox alignment after the pickup navigation.
    # The measured platform maps micro pos[1] to +base_footprint X.
    drag_box_tf_workflow_reference_base_x_m: 0.110135
    drag_box_tf_workflow_base_x_tolerance_m: 0.010
    # Select the negative-Joint4 branch for the initial right-arm MoveJ_P IK.
    # This constraint applies only to DragBox's first right-arm target; later
    # MoveL endpoint IK checks are not sign-filtered.
    drag_box_tf_right_initial_ik_joint4_negative_required: false
    drag_box_tf_right_initial_ik_joint4_seed_deg: -60.0
    # Reserved DragBox-only post-waist pre-MoveJ interface. It is disabled and
    # deliberately does not inherit any direct-grasp joint posture.
    drag_box_tf_post_waist_pre_movej_enabled: false
    # After the left arm reaches its DragBox avoidance posture, prepare only
    # the right arm with the matching GraspBox box-type/layer joint target.
    drag_box_tf_right_grasp_preparation_enabled: true
    # Interactive calibration-only hold point. Keep false in normal missions.
    drag_box_tf_calibration_stop_after_initial_right_target_enabled: false
    # Hold after Drag3 re-anchoring and left-arm join, before bilateral clamp.
    drag_box_tf_calibration_stop_after_left_join_enabled: false
    # Calibration-only override: after Drag3, bypass pose IK and MoveJ the
    # left arm to this fixed temporary posture, then stop for hand correction.
    drag_box_tf_calibration_left_join_joint_override_enabled: false
    drag_box_tf_calibration_left_join_joint_target_deg:
    - -62.412
    - 25.861
    - 24.668
    - -40.876
    - -35.381
    - -8.514
    - -3.713
    # Continuous two-sided calibration: pause one Action at the right target,
    # then continue Drag1/2/3 without re-entering left-arm observation.
    drag_box_tf_calibration_pause_after_initial_right_target_enabled: false
    drag_box_tf_calibration_continue_after_initial_right_target: false
    drag_box_tf_calibration_pause_timeout_sec: 1800.0
    drag_box_tf_post_waist_pre_movej_command_units_per_degree: 1000.0
