    # Robot forward is base_footprint -Y (URDF front wheels have negative Y).
    # Scale contact-center Y relative to box origin before Link8 compensation.
    # Preserve footprint X/Z and orientation; 1.0 is an exact no-op.
    # GraspBox TF only; left/right independent, shared by box sizes/layers.
    grasp_box_tf_left_contact_forward_delta_scale: 1.0
